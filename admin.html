<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmniVoice TTS 控制台</title>
<style>
  :root {
    --bg: #12151c;
    --bg-soft: #191d27;
    --card: #1d222d;
    --card-2: #232936;
    --line: #2e3543;
    --text: #e6e9ef;
    --text-dim: #98a1b3;
    --accent: #4f8cff;
    --accent-2: #2f6ae0;
    --ok: #3fbf7f;
    --warn: #e0a33a;
    --err: #e0605f;
    --mono: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
  }
  [data-theme="light"] {
    --bg: #f4f6fa;
    --bg-soft: #eaeef5;
    --card: #ffffff;
    --card-2: #f6f8fc;
    --line: #d9dfea;
    --text: #1c2230;
    --text-dim: #5d6779;
    --accent: #2f6ae0;
    --accent-2: #1f4fb0;
    --ok: #1f8a52;
    --warn: #a9701a;
    --err: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 0 48px;
    background: var(--bg); color: var(--text);
    font: 14px/1.6 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 12px 20px;
    background: var(--bg-soft); border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: .3px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--text-dim); display: inline-block; }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
  .dot.off { background: var(--err); }
  .meta { color: var(--text-dim); font-size: 12px; font-family: var(--mono); }
  .spacer { flex: 1; }
  button {
    background: var(--card-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 13px; cursor: pointer; font-size: 13px;
  }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover { background: var(--accent-2); }
  button.danger:hover { border-color: var(--err); color: var(--err); }
  main { max-width: 1180px; margin: 0 auto; padding: 18px 20px; display: grid; gap: 18px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .card h2 { margin: 0 0 12px; font-size: 14px; font-weight: 650; color: var(--text-dim); letter-spacing: .5px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 5px; }
  input, textarea, select {
    width: 100%; background: var(--card-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
    font: inherit; font-size: 13px;
  }
  textarea { min-height: 96px; resize: vertical; line-height: 1.6; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .check { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); }
  .check input { width: auto; }
  .hint { font-size: 11.5px; color: var(--text-dim); margin-top: 5px; }
  #status { font-size: 13px; min-height: 20px; margin-top: 10px; }
  #status.busy { color: var(--accent); }
  #status.err { color: var(--err); }
  #status.ok { color: var(--ok); }
  .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .stats { color: var(--text-dim); font-size: 12px; font-family: var(--mono); }
  .rec { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; background: var(--card-2); }
  .rec-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; border: 1px solid var(--line); color: var(--text-dim); font-family: var(--mono); }
  .badge.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
  .badge.err { color: var(--err); border-color: color-mix(in srgb, var(--err) 40%, var(--line)); }
  .badge.src { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
  .text { font-size: 13px; white-space: pre-wrap; word-break: break-word; margin-bottom: 8px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .chip { font-size: 11.5px; font-family: var(--mono); color: var(--text-dim); background: var(--bg-soft); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; }
  .chip-btn { cursor: pointer; font-family: inherit; }
  .chip-btn:hover { border-color: var(--accent); color: var(--accent); }
  audio { width: 100%; height: 36px; margin: 4px 0 8px; }
  .rec-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .empty { color: var(--text-dim); font-size: 13px; padding: 20px 0; text-align: center; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<header>
  <h1>OmniVoice TTS 控制台</h1>
  <span id="dot" class="dot"></span>
  <span class="meta" id="health">连接中…</span>
  <span class="spacer"></span>
  <button id="theme">切换主题</button>
</header>

<main>
  <section class="card">
    <h2>发起合成请求</h2>
    <label for="text">文本内容</label>
    <textarea id="text" placeholder="输入要合成的文本…">你好，这是一段来自 OmniVoice 的语音合成测试。</textarea>

    <div class="grid" style="margin-top:12px">
      <div style="grid-column:1/-1">
        <label for="voice">声音 / 属性描述</label>
        <input id="voice" list="voiceList" value="alloy" placeholder="alloy 或 female, elderly, 四川话">
        <datalist id="voiceList"></datalist>
        <div class="hint">预设名走映射；不在列表里的值当作文字造声属性直接透传。点下方标签可拼装（英文项后自动补 ", "，中文项补 "，"）。</div>
        <div class="chips" id="attrEn" style="margin-top:7px"></div>
        <div class="chips" id="attrZh"></div>
      </div>
      <div>
        <label for="instructions">附加属性（可选）</label>
        <input id="instructions" placeholder="british accent 或 四川话">
        <div class="hint">仅支持 OmniVoice 属性项：<b>不可中英混用</b>，不支持情绪词。勾选下方开关才生效。</div>
      </div>
      <div>
        <label for="speed">语速 speed</label>
        <input id="speed" type="number" step="0.05" min="0.5" max="2" value="1.0">
      </div>
      <div>
        <label for="steps">扩散步数 num_step</label>
        <input id="steps" type="number" step="1" min="1" max="100" value="32">
        <div class="hint">越大越稳越慢。</div>
      </div>
      <div>
        <label for="format">输出格式</label>
        <select id="format">
          <option value="mp3" selected>mp3</option>
          <option value="wav">wav</option>
        </select>
      </div>
    </div>

    <div class="row">
      <label class="check"><input id="useInstr" type="checkbox"> 附加指令拼入属性串</label>
      <span class="spacer"></span>
      <button id="gen" class="primary">生成</button>
    </div>
    <div id="status"></div>
    <div id="latest"></div>
  </section>

  <section class="card">
    <h2>请求记录</h2>
    <div class="toolbar">
      <button id="refresh">刷新</button>
      <button id="clear" class="danger">清空记录</button>
      <label class="check" style="margin-left:4px">
        显示条数
        <input id="limit" type="number" min="1" max="500" value="50" style="width:80px">
      </label>
      <span class="spacer"></span>
      <span class="stats" id="stats"></span>
    </div>
    <div id="records"><div class="empty">加载中…</div></div>
  </section>
</main>

<script>
/* OmniVoice 接受的合法属性项（模型侧强校验：不可中英混用、无情绪轴）。 */
const ATTR_EN = ["female", "male", "child", "teenager", "young adult", "middle-aged", "elderly",
  "very low pitch", "low pitch", "moderate pitch", "high pitch", "very high pitch", "whisper",
  "american accent", "british accent", "australian accent", "canadian accent", "indian accent",
  "chinese accent", "japanese accent", "korean accent", "portuguese accent", "russian accent"];
const ATTR_ZH = ["女", "男", "儿童", "少年", "青年", "中年", "老年",
  "极低音调", "低音调", "中音调", "高音调", "极高音调", "耳语",
  "四川话", "东北话", "云南话", "宁夏话", "桂林话", "河南话", "济南话",
  "甘肃话", "石家庄话", "贵州话", "陕西话", "青岛话"];
let PRESET = [];

const $ = (id) => document.getElementById(id);
const api = (p, opt) => fetch(p, Object.assign({ headers: { "Content-Type": "application/json" } }, opt || {}));

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function fmtBytes(n) {
  n = Number(n || 0);
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
  return (n / 1048576).toFixed(2) + " MB";
}
function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso.length > 10 && iso.includes("T") ? iso : iso.replace(" ", "T"));
  return isNaN(d) ? iso : d.toLocaleString("zh-CN", { hour12: false });
}

/* ---------- theme ---------- */
(function () {
  const saved = localStorage.getItem("omni-theme");
  if (saved) document.documentElement.dataset.theme = saved;
  $("theme").onclick = () => {
    const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    localStorage.setItem("omni-theme", next);
  };
})();

/* ---------- health / voices ---------- */
async function loadHealth() {
  try {
    const r = await api("/health");
    const h = await r.json();
    $("dot").className = "dot " + (h.loaded ? "on" : "off");
    $("health").textContent = [h.loaded ? "模型已加载" : "模型未加载",
      h.device, h.dtype, h.cuda ? "CUDA" : "CPU"].filter(Boolean).join(" · ");
    PRESET = h.voices || [];
    $("voiceList").innerHTML = PRESET.map((v) => `<option value="${esc(v)}"></option>`).join("");
    renderAttrs();
  } catch (e) {
    $("dot").className = "dot off";
    $("health").textContent = "服务未响应";
  }
}

/* ---------- attribute picker ---------- */
const hasZh = (s) => /[\u4e00-\u9fa5]/.test(s);

function renderAttrs() {
  const mk = (list, zh) => list.map((a) =>
    `<button type="button" class="chip chip-btn" data-attr="${esc(a)}" data-zh="${zh ? 1 : 0}">${esc(a)}</button>`
  ).join("");
  $("attrEn").innerHTML = `<span class="chip" style="border:none;background:none;padding-left:0">英文</span>` + mk(ATTR_EN, false);
  $("attrZh").innerHTML = `<span class="chip" style="border:none;background:none;padding-left:0">中文</span>` + mk(ATTR_ZH, true);
  document.querySelectorAll(".chip-btn").forEach((b) => {
    b.onclick = () => appendAttr(b.dataset.attr, b.dataset.zh === "1");
  });
}

function appendAttr(val, zh) {
  const el = $("voice");
  let cur = el.value.trim();
  if (PRESET.includes(cur)) cur = "";
  let items = cur.split(/[，,]/).map((s) => s.trim()).filter(Boolean);
  // Mixing English and Chinese items is rejected by the model, so switching
  // language restarts the attribute string instead of appending.
  if (items.length && hasZh(items[0]) !== zh) items = [];
  if (items.includes(val)) return;
  items.push(val);
  el.value = items.join(zh ? "，" : ", ");
}

/* ---------- generate ---------- */
$("gen").onclick = async () => {
  const btn = $("gen"), st = $("status");
  const text = $("text").value.trim();
  if (!text) { st.className = "err"; st.textContent = "文本内容不能为空"; return; }

  btn.disabled = true;
  st.className = "busy";
  st.textContent = "生成中…（串行排队，步数越大越慢）";
  $("latest").innerHTML = "";

  const body = {
    input: text,
    voice: $("voice").value.trim() || "alloy",
    instructions: $("instructions").value.trim(),
    speed: Number($("speed").value || 1),
    num_step: Number($("steps").value || 32),
    response_format: $("format").value,
    use_instructions: $("useInstr").checked
  };

  const t0 = performance.now();
  try {
    const r = await api("/admin/generate", { method: "POST", body: JSON.stringify(body) });
    const data = await r.json();
    const wall = ((performance.now() - t0) / 1000).toFixed(1);
    if (!r.ok || data.status !== "ok") {
      st.className = "err";
      st.textContent = "失败：" + (data.error || data.detail || r.status);
      return;
    }
    st.className = "ok";
    st.textContent = `完成：${data.bytes} 字节 · ${data.elapsed_ms} ms 推理解码 · 端到端 ${wall}s · 记录 ${data.id}`;
    $("latest").innerHTML = renderPlayer(data);
    loadHistory();
  } catch (e) {
    st.className = "err";
    st.textContent = "请求异常：" + e;
  } finally {
    btn.disabled = false;
  }
};

function renderPlayer(d) {
  return `<div class="rec"><div class="rec-head">
      <span class="badge ok">最新产出</span><span class="badge">${esc(d.format)}</span>
      <span class="chip">${fmtBytes(d.bytes)}</span></div>
    <audio controls src="${esc(d.audio_url)}"></audio>
    <div class="rec-actions"><a href="${esc(d.audio_url)}&download=1"><button>下载</button></a></div></div>`;
}

/* ---------- history ---------- */
async function loadHistory() {
  const limit = Math.max(1, Math.min(500, Number($("limit").value || 50)));
  let data;
  try {
    const r = await api("/admin/history?limit=" + limit);
    data = await r.json();
  } catch (e) {
    $("records").innerHTML = `<div class="empty">读取记录失败：${esc(e)}</div>`;
    return;
  }
  $("stats").textContent = `共 ${data.total} 条 · 成功 ${data.ok} · 失败 ${data.failed} · 产出 ${fmtBytes(data.bytes_total)}`;
  const items = data.items || [];
  if (!items.length) {
    $("records").innerHTML = `<div class="empty">暂无记录。上面发一次请求就会在这里留档。</div>`;
    return;
  }
  $("records").innerHTML = items.map((r) => {
    const chips = [
      "voice=" + (r.voice || "-"),
      "speed=" + r.speed,
      "step=" + r.num_step,
      r.format,
      r.elapsed_ms != null ? r.elapsed_ms + "ms" : null,
      r.bytes ? fmtBytes(r.bytes) : null
    ].filter(Boolean).map((c) => `<span class="chip">${esc(c)}</span>`).join("");
    const audio = r.audio_url
      ? `<audio controls src="${esc(r.audio_url)}"></audio>` : "";
    return `<div class="rec" data-id="${esc(r.id)}">
      <div class="rec-head">
        <span class="badge ${r.status === "ok" ? "ok" : "err"}">${esc(r.status)}</span>
        <span class="badge src">${esc(r.source || "-")}</span>
        <span class="meta">${esc(fmtTime(r.time))}</span>
        <span class="spacer"></span>
        <span class="meta">${esc(r.id)}</span>
      </div>
      <div class="text">${esc(r.text)}</div>
      <div class="chips">${chips}${r.instruct ? `<span class="chip">属性: ${esc(r.instruct)}</span>` : ""}</div>
      ${r.error ? `<div class="text" style="color:var(--err)">${esc(r.error)}</div>` : ""}
      ${audio}
      <div class="rec-actions">
        <button data-act="reuse">复用参数</button>
        ${r.audio_url ? `<a href="${esc(r.audio_url)}&download=1"><button>下载音频</button></a>` : ""}
        <button data-act="del" class="danger">删除</button>
      </div>
    </div>`;
  }).join("");
}

$("records").addEventListener("click", async (ev) => {
  const btn = ev.target.closest("button[data-act]");
  if (!btn) return;
  const box = btn.closest(".rec");
  const id = box.dataset.id;
  const act = btn.dataset.act;
  if (act === "del") {
    if (!confirm("删除这条记录及其音频产出？")) return;
    await api("/admin/history/" + encodeURIComponent(id), { method: "DELETE" });
    loadHistory();
  } else if (act === "reuse") {
    const r = await api("/admin/history/" + encodeURIComponent(id));
    const rec = await r.json();
    $("text").value = rec.text || "";
    $("voice").value = rec.voice || "";
    $("instructions").value = rec.instructions || "";
    $("speed").value = rec.speed || 1;
    $("steps").value = rec.num_step || 32;
    $("format").value = rec.format || "mp3";
    $("useInstr").checked = !!rec.use_instructions;
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
});

$("refresh").onclick = loadHistory;
$("limit").onchange = loadHistory;
$("clear").onclick = async () => {
  if (!confirm("清空全部历史记录与音频产出？此操作不可撤销。")) return;
  await api("/admin/history", { method: "DELETE" });
  loadHistory();
};

loadHealth();
loadHistory();
</script>
</body>
</html>
